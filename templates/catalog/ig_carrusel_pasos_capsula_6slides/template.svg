    <rect x="80" y="250" width="200" height="335" rx="100" fill="#3B49DF" fill-opacity=".12"/>
    <foreignObject x="80" y="660" width="920" height="124" data-campo="{{titulo}}" data-lineas-max="2" data-fuente-min="48">
      <div xmlns="http://www.w3.org/1999/xhtml" class="t titulo" style="font-size:52px;line-height:62px;height:124px;color:#3B49DF;">{{titulo}}</div>
    </foreignObject>
    <foreignObject x="80" y="826" width="920" height="312" data-campo="{{cuerpo}}" data-lineas-max="6" data-fuente-min="30">
      <div xmlns="http://www.w3.org/1999/xhtml" class="t cuerpo" style="font-size:36px;line-height:52px;height:312px;color:#344054;">{{cuerpo}}</div>
    </foreignObject>
    <g id="progreso-3"><rect x="80" y="1240" width="140" height="8" rx="4" fill="#3B49DF" fill-opacity="0.25"/><rect x="236" y="1240" width="140" height="8" rx="4" fill="#3B49DF" fill-opacity="0.25"/><rect x="392" y="1240" width="140" height="8" rx="4" fill="#3B49DF" fill-opacity="1"/><rect x="548" y="1240" width="140" height="8" rx="4" fill="#3B49DF" fill-opacity="0.25"/><rect x="704" y="1240" width="140" height="8" rx="4" fill="#3B49DF" fill-opacity="0.25"/><rect x="860" y="1240" width="140" height="8" rx="4" fill="#3B49DF" fill-opacity="0.25"/></g>
  </g>
  <g id="slide-4" class="slide" data-rol="desarrollo">
    <rect x="80" y="136" width="150" height="34" rx="17" fill="url(#degradado)"/>
    <circle cx="262" cy="153" r="17" fill="#FFFFFF"/>
    <foreignObject x="80" y="220" width="920" height="124" data-campo="{{titulo}}" data-lineas-max="2" data-fuente-min="48">
      <div xmlns="http://www.w3.org/1999/xhtml" class="t titulo" style="font-size:52px;line-height:62px;height:124px;color:#FFFFFF;">{{titulo}}</div>
