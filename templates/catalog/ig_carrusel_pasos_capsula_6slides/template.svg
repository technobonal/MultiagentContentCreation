    </foreignObject>
    <g class="zona-foto" data-foto="imagen_apoyo_4"><rect x="80" y="750" width="920" height="420" rx="210" fill="url(#degradado)"/></g>
    <g id="imagen-apoyo-4" class="hueco-imagen" data-campo="{{imagen_apoyo_4}}" data-opcional="true">
