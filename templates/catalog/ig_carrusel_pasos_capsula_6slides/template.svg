      <rect x="80" y="750" width="920" height="420" rx="210" class="hueco-forma" data-radio="22.8% / 50%" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="4"/>
      <g clip-path="url(#recorte-foto-4)"><image x="80" y="750" width="920" height="420" preserveAspectRatio="xMidYMid slice" href="{{imagen_apoyo_4}}"/></g>
