    <g id="progreso-4"><rect x="80" y="1240" width="140" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.25"/><rect x="236" y="1240" width="140" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.25"/><rect x="392" y="1240" width="140" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.25"/><rect x="548" y="1240" width="140" height="8" rx="4" fill="#FFFFFF" fill-opacity="1"/><rect x="704" y="1240" width="140" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.25"/><rect x="860" y="1240" width="140" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.25"/></g>
  </g>
  <g id="slide-5" class="slide" data-rol="cierre">
    <rect x="80" y="136" width="150" height="34" rx="17" fill="url(#degradado)"/>
    <circle cx="262" cy="153" r="17" fill="#3B49DF"/>
    <foreignObject x="80" y="220" width="920" height="124" data-campo="{{titulo}}" data-lineas-max="2" data-fuente-min="48">
      <div xmlns="http://www.w3.org/1999/xhtml" class="t titulo" style="font-size:52px;line-height:62px;height:124px;color:#3B49DF;">{{titulo}}</div>
    </foreignObject>
    <rect x="92" y="396" width="920" height="226" rx="40" fill="#101828" fill-opacity=".18"/>
    <rect x="80" y="384" width="920" height="226" rx="40" fill="#3B49DF"/>
    <foreignObject x="132" y="416" width="816" height="162" data-campo="{{cta}}" data-lineas-max="3" data-fuente-min="36">
      <div xmlns="http://www.w3.org/1999/xhtml" class="t sobre-acento" style="display:flex;align-items:center;font-size:40px;line-height:54px;height:162px;color:#FFFFFF;">{{cta}}</div>
    </foreignObject>
    <g class="zona-foto" data-foto="imagen_cierre"><circle cx="540" cy="930" r="260" fill="url(#degradado)"/></g>
    <g id="imagen-cierre" class="hueco-imagen" data-campo="{{imagen_cierre}}" data-opcional="true">
