    <rect x="80" y="713" width="920" height="2" fill="#FFFFFF" fill-opacity=".35"/>
    <foreignObject x="80" y="745" width="920" height="40" data-campo="{{sello_revision}}" data-lineas-max="1" data-fuente-min="24">
