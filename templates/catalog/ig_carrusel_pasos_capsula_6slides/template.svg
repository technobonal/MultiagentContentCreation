    <g id="progreso-5"><rect x="80" y="1240" width="140" height="8" rx="4" fill="#3B49DF" fill-opacity="0.25"/><rect x="236" y="1240" width="140" height="8" rx="4" fill="#3B49DF" fill-opacity="0.25"/><rect x="392" y="1240" width="140" height="8" rx="4" fill="#3B49DF" fill-opacity="0.25"/><rect x="548" y="1240" width="140" height="8" rx="4" fill="#3B49DF" fill-opacity="0.25"/><rect x="704" y="1240" width="140" height="8" rx="4" fill="#3B49DF" fill-opacity="1"/><rect x="860" y="1240" width="140" height="8" rx="4" fill="#3B49DF" fill-opacity="0.25"/></g>
