    <rect x="640" y="900" width="580" height="260" rx="130" fill="url(#degradado)"/>
    <g id="progreso-6"><rect x="80" y="1240" width="140" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.25"/><rect x="236" y="1240" width="140" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.25"/><rect x="392" y="1240" width="140" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.25"/><rect x="548" y="1240" width="140" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.25"/><rect x="704" y="1240" width="140" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.25"/><rect x="860" y="1240" width="140" height="8" rx="4" fill="#FFFFFF" fill-opacity="1"/></g>
